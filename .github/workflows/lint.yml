name: Lint CI

on:
  push:
    branches:
      - "feature/**"
      - "hotfix/**"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies + linter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run lint
        run: |
          flake8 api fakenews_backend --max-line-length=100 --exclude=migrations